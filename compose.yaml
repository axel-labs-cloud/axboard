services:
  axboard:
    image: axboard:dev
    build:
      context: .
      dockerfile: Containerfile
    container_name: axboard
    # NET_RAW lets the ICMP ping health-check type send echo requests.
    cap_add:
      - NET_RAW
    # label=disable runs the container unconfined by SELinux so it can reach the
    # mounted Podman socket (auto-discovery). Remove this and the socket mount
    # below together if you don't use discovery.
    security_opt:
      - label=disable
    # Host networking so the container shares the host's network namespace.
    # This lets the host-stats / gauge widgets read real host network I/O from
    # /proc/net/dev (which is per-netns — under the default bridge the container
    # only sees its own veth). It also means the app binds directly to the host
    # port, so the `ports:` mapping below is intentionally omitted. Drop this
    # line to go back to bridged networking (network I/O will then show only the
    # container's own traffic).
    network_mode: host
    # Host PID namespace so the top-processes widget can see the host's
    # processes (otherwise the container only sees its own). Drop it if you
    # don't use that widget.
    pid: host
    volumes:
      # Bind-mount the parent directory rather than the file. Hot reload via
      # fsnotify needs to see CREATE/RENAME events in the directory, which
      # single-file bind mounts don't propagate from the host.
      - ./config:/etc/axboard:Z
      - axboard-state:/var/lib/axboard:Z
      # Read-only Podman socket for auto-discovery (Docker-API compatible).
      # Comment out to disable discovery.
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/var/run/docker.sock:ro
      # Read-only host root so the Filesystems widget can statfs the host's real
      # mounts (paired with AXBOARD_HOST_ROOT below). Exposes host files to the
      # container read-only — remove both if you don't want that. Without it the
      # widget shows only the container's visible mounts.
      - /:/host:ro,rslave
    environment:
      - AXBOARD_HOST_ROOT=/host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  axboard-state:
