# ianua GitLab CI. Scoped to merge_request_event + main pushes so
# feature-branch backups don't burn pipeline minutes.

stages:
  - lint
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

default:
  interruptible: true

variables:
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"

.go-cache:
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-mod
      - .cache/go-build
    fallback_keys:
      - go-cache-default
    policy: pull-push

.web-cache:
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/node_modules
      - .cache/npm
    fallback_keys:
      - web-cache-default
    policy: pull-push

vet:
  stage: lint
  image: docker.io/library/golang:1.26-alpine
  extends: .go-cache
  before_script:
    - apk add --no-cache git
  script:
    - go vet ./...

web-check:
  stage: lint
  image: docker.io/library/node:22-alpine
  extends: .web-cache
  before_script:
    - cd web
    - npm ci --no-audit --no-fund --prefer-offline
  script:
    - npx tsc --noEmit
    - npm run build

build:
  stage: build
  image: docker.io/library/docker:27
  services:
    # Route docker.io pulls through Google's docker.io mirror so the
    # build doesn't hit the Docker Hub anonymous rate limit on every push.
    # `alias: docker` is required — without it, the runner derives the
    # service hostname from the fully-qualified image name and DOCKER_HOST
    # can't resolve `docker:2375`.
    - name: docker.io/library/docker:27-dind
      alias: docker
      command: ["--registry-mirror=https://mirror.gcr.io"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script: []
  script:
    # SHA tag for pinning; branch tag for "latest of this line".
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH" -f Containerfile .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH"
    # On main, also tag :latest so the deployments repo can pin a default.
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
