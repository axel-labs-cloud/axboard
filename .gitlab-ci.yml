# axboard GitLab CI. Scoped to merge_request_event + main pushes so
# feature-branch backups don't burn pipeline minutes.

stages:
  - lint
  - build
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

default:
  interruptible: true

variables:
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"

.go-cache:
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-mod
      - .cache/go-build
    fallback_keys:
      - go-cache-default
    policy: pull-push

.web-cache:
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/node_modules
      - .cache/npm
    fallback_keys:
      - web-cache-default
    policy: pull-push

vet:
  stage: lint
  image: docker.io/library/golang:1.26-alpine
  extends: .go-cache
  before_script:
    - apk add --no-cache git
  script:
    - go vet ./...

test:
  stage: lint
  image: docker.io/library/golang:1.26-alpine
  extends: .go-cache
  before_script:
    - apk add --no-cache git gcc musl-dev
  script:
    - go test -race ./...

web-check:
  stage: lint
  image: docker.io/library/node:22-alpine
  extends: .web-cache
  before_script:
    - cd web
    - npm ci --no-audit --no-fund --prefer-offline
  script:
    - npx tsc --noEmit
    - npm run build

build:
  stage: build
  image: docker.io/library/docker:27
  services:
    # Route docker.io pulls through Google's docker.io mirror so the
    # build doesn't hit the Docker Hub anonymous rate limit on every push.
    # `alias: docker` is required — without it, the runner derives the
    # service hostname from the fully-qualified image name and DOCKER_HOST
    # can't resolve `docker:2375`.
    - name: docker.io/library/docker:27-dind
      alias: docker
      command: ["--registry-mirror=https://mirror.gcr.io"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    # Register QEMU handlers + a buildx builder for multi-arch (amd64 + arm64).
    - docker run --privileged --rm docker.io/tonistiigi/binfmt --install arm64,amd64
    - docker buildx create --use --name axb --driver docker-container || docker buildx use axb
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    # SHA tag pins; branch/tag tags track a line; :latest on main + tags.
    - |
      TAGS="-t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$TAGS -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG -t $CI_REGISTRY_IMAGE:latest"
        VER="$CI_COMMIT_TAG"
      else
        TAGS="$TAGS -t $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH"
        [ "$CI_COMMIT_BRANCH" = "main" ] && TAGS="$TAGS -t $CI_REGISTRY_IMAGE:latest"
        VER="$CI_COMMIT_SHA"
      fi
      docker buildx build --platform linux/amd64,linux/arm64 \
        --build-arg VERSION="$VER" --build-arg BUILD_DATE="$BUILD_DATE" \
        $TAGS --push -f Containerfile .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Cut a GitLab Release when a v* tag is pushed.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["build"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "axboard $CI_COMMIT_TAG"
    description: "Automated release for $CI_COMMIT_TAG.\n\nMulti-arch image (amd64/arm64): `$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG`"
